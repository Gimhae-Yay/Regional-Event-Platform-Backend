spring:
  application:
    name: region-event-backend
  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:6379}

security:
  jwt:
    access:
      issuer: regional-event-platform
      audience: regional-event-api
      active-key-id: ${JWT_ACCESS_ACTIVE_KEY_ID}
      active-key: ${JWT_ACCESS_ACTIVE_KEY}
      authorities-claim-required: ${JWT_ACCESS_AUTHORITIES_CLAIM_REQUIRED:false}
    refresh:
      issuer: regional-event-platform
      audience: regional-event-refresh
      active-key-id: ${JWT_REFRESH_ACTIVE_KEY_ID}
      active-key: ${JWT_REFRESH_ACTIVE_KEY}
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}
    api-public-origin: ${SECURITY_CORS_API_PUBLIC_ORIGIN:}
    site-registrable-domain: ${SECURITY_CORS_SITE_REGISTRABLE_DOMAIN:}
  qr:
    active-key-id: ${QR_ACTIVE_KEY_ID}
    active-key: ${QR_ACTIVE_KEY}
    token-ttl: ${QR_TOKEN_TTL}

idempotency:
  retention: PT24H
  cleanup-fixed-delay: PT1H
  cleanup-initial-delay: PT1H
  lock-wait-timeout-seconds: 3

portone:
  api-secret: ${PORTONE_API_SECRET:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  fake:
    enabled: ${PORTONE_FAKE_ENABLED:false}
    payment-amount: ${PORTONE_FAKE_PAYMENT_AMOUNT:10000}
    currency: ${PORTONE_FAKE_CURRENCY:KRW}
    store-id: ${PORTONE_FAKE_STORE_ID:perf-store}
    transaction-id-prefix: ${PORTONE_FAKE_TRANSACTION_ID_PREFIX:perf-transaction-}
    cancellation-id-prefix: ${PORTONE_FAKE_CANCELLATION_ID_PREFIX:perf-cancellation-}

public-catalog-cache:
  ttl: ${PUBLIC_CATALOG_CACHE_TTL:PT10M}

reservation:
  hold-termination:
    initial-delay: PT1M
    fixed-delay: PT1M
  no-show-completion:
    initial-delay: PT1M
    fixed-delay: PT1M

coupon:
  expiration:
    cron: "0 */5 * * * *"

storage:
  fake:
    enabled: ${IMAGE_STORAGE_FAKE_ENABLED:false}
    base-url: ${IMAGE_STORAGE_FAKE_BASE_URL:https://example.invalid/local-image-storage}

performance:
  fixture:
    enabled: ${PERFORMANCE_FIXTURE_ENABLED:false}
    reset-token: ${PERFORMANCE_FIXTURE_RESET_TOKEN:}

content:
  publication:
    initial-delay: PT1M
    fixed-delay: PT1M

mission:
  auto-ending:
    initial-delay: PT1M
    fixed-delay: PT1M

management:
  endpoint:
    health:
      show-components: never
      show-details: never
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg %kvp%n"
