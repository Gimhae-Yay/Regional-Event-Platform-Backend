services:
  api:
    image: ${API_IMAGE:?API_IMAGE must be set}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_REDIS_HOST: ${AUTH_REDIS_HOST:?AUTH_REDIS_HOST must be set}
      AUTH_REDIS_PORT: ${AUTH_REDIS_PORT:-6379}
      # Terraform user-data가 SSM SecureString을 .env에만 기록합니다.
      # Compose에 기본값을 두지 않아 Redis 인증 토큰 누락을 배포 시점에 즉시 실패시킵니다.
      AUTH_REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?AUTH_REDIS_PASSWORD must be set}
      # 운영 결제·웹훅 검증은 fake 모드가 아니므로 두 PortOne 비밀값을 별도로 요구합니다.
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:?PORTONE_API_SECRET must be set}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET:?PORTONE_WEBHOOK_SECRET must be set}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL must be set}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD must be set}
      JWT_ACCESS_ACTIVE_KEY_ID: ${JWT_ACCESS_ACTIVE_KEY_ID:?JWT_ACCESS_ACTIVE_KEY_ID must be set}
      JWT_ACCESS_ACTIVE_KEY: ${JWT_ACCESS_ACTIVE_KEY:?JWT_ACCESS_ACTIVE_KEY must be set}
      JWT_REFRESH_ACTIVE_KEY_ID: ${JWT_REFRESH_ACTIVE_KEY_ID:?JWT_REFRESH_ACTIVE_KEY_ID must be set}
      JWT_REFRESH_ACTIVE_KEY: ${JWT_REFRESH_ACTIVE_KEY:?JWT_REFRESH_ACTIVE_KEY must be set}
      QR_ACTIVE_KEY_ID: ${QR_ACTIVE_KEY_ID:?QR_ACTIVE_KEY_ID must be set}
      QR_ACTIVE_KEY: ${QR_ACTIVE_KEY:?QR_ACTIVE_KEY must be set}
      QR_TOKEN_TTL: ${QR_TOKEN_TTL:?QR_TOKEN_TTL must be set}
      STORAGE_S3_ENABLED: ${STORAGE_S3_ENABLED:-false}
      STORAGE_S3_BUCKET_NAME: ${STORAGE_S3_BUCKET_NAME:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
    ports:
      - "${API_PORT:-8080}:8080"
