name: 신규 작업(Task) 생성
description: 신규 테스크 생성
title: "[TASK] "
type: Task
labels:
  - NEED_TRIAGE
projects:
  - Gimhae-Yay/1
assignees: []

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 신규 task에 대한 요약 입니다.
    validations:
      required: true

  - type: dropdown
    id: work-type
    attributes:
      label: 작업 성격
      description: 구현 모드와 작업 브랜치 type을 정하는 라벨을 정확히 하나 선택해 주세요.
      multiple: false
      options:
        - New Feature
        - Fix
        - Refactor
        - Test
        - Docs
        - Chore
    validations:
      required: true

  - type: textarea
    id: api-documentation
    attributes:
      label: API Documentation
      description: 연관된 API 명세서 링크를 카피 페이스트 해주세요.
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: 신규 task에 대한 상세 설명을 작성해주세요.
    validations:
      required: true


  - type: textarea
    id: todo
    attributes:
      label: TODO
      description: 작업 TODO 리스트를 반드시 체크 박스 형식으로 작성해 주세요.
      placeholder: |
        - [ ] TODO 1
        - [ ] TODO 2
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: Other
      description: 기타 특이사항 작성 해주세요.
    validations:
      required: false
