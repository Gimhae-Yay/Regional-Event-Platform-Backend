name: 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AUTO_SCALING_GROUP_NAME: ${{ vars.AUTO_SCALING_GROUP_NAME }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  DEPLOYMENT_PARAMETER_PREFIX: /regional-event/prod

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: ECR 이미지 배포 및 EC2 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: ARM64 QEMU 설정
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Linux ARM64 API 이미지 빌드 및 푸시
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker buildx build \
            --platform linux/arm64 \
            --tag "$image_uri:${GITHUB_SHA}" \
            --tag "$image_uri:latest" \
            --push \
            .

      - name: 새 인스턴스가 사용할 런타임 구성 기록
        run: |
          set -euo pipefail
          compose_file="compose.api.yaml"
          compose_size="$(wc -c < "$compose_file")"
          test "$compose_size" -le 4096
          aws ssm put-parameter \
            --name "$DEPLOYMENT_PARAMETER_PREFIX/API_IMAGE_TAG" \
            --type String \
            --value "$GITHUB_SHA" \
            --overwrite
          aws ssm put-parameter \
            --name "$DEPLOYMENT_PARAMETER_PREFIX/COMPOSE_FILE" \
            --type String \
            --value "$(< "$compose_file")" \
            --overwrite

      - name: 기존 ASG 인스턴스 종료
        id: terminate-instance
        run: |
          set -euo pipefail
          instance_id="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$AUTO_SCALING_GROUP_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId | [0]" \
            --output text)"
          test -n "$instance_id" && test "$instance_id" != "None"
          aws autoscaling terminate-instance-in-auto-scaling-group \
            --instance-id "$instance_id" \
            --no-should-decrement-desired-capacity
          echo "previous_instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: 새 ASG 인스턴스 대기
        id: new-instance
        env:
          PREVIOUS_INSTANCE_ID: ${{ steps.terminate-instance.outputs.previous_instance_id }}
        run: |
          set -euo pipefail
          for _ in {1..36}; do
            instance_id="$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$AUTO_SCALING_GROUP_NAME" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && InstanceId!='${PREVIOUS_INSTANCE_ID}'].InstanceId | [0]" \
              --output text)"
            if test -n "$instance_id" && test "$instance_id" != "None"; then
              echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "새 ASG 인스턴스가 InService 상태가 되지 않았습니다." >&2
          exit 1

      - name: EC2 SSM 온라인 상태 대기
        env:
          INSTANCE_ID: ${{ steps.new-instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          for _ in {1..36}; do
            ping_status="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)"
            if test "$ping_status" = "Online"; then
              exit 0
            fi
            sleep 10
          done
          echo "새 EC2 인스턴스가 SSM에 온라인으로 등록되지 않았습니다." >&2
          exit 1

      - name: API Compose와 Health 응답 검증
        env:
          INSTANCE_ID: ${{ steps.new-instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          cat > /tmp/verify-compose-stack.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          for _ in {1..36}; do
            if command -v docker >/dev/null 2>&1 && test -f /opt/regional-event/compose.yaml; then
              cd /opt/regional-event
              running_services="$(
                docker ps \
                  --filter 'status=running' \
                  --filter 'label=com.docker.compose.project=regional-event' \
                  --format '{{.Label "com.docker.compose.service"}}' | sort
              )"
              if printf '%s\n' "$running_services" | grep -Fx api >/dev/null \
                && test "$(printf '%s\n' "$running_services" | sed '/^$/d' | wc -l)" -eq 1; then
                health_body="$(curl --fail --silent --show-error --max-time 5 http://localhost:8080/actuator/health || true)"
                if printf '%s' "$health_body" \
                  | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          exit 1
          EOF
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$(jq -nc --rawfile command /tmp/verify-compose-stack.sh '{commands: [$command]}')" \
            --query 'Command.CommandId' \
            --output text)"
          for _ in {1..48}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
                exit 0
                ;;
              Pending|InProgress|Delayed|Cancelling|"")
                sleep 10
                ;;
              *)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
                echo "Compose 원격 검증이 실패했습니다. 상태: $status" >&2
                exit 1
                ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          echo "Compose 원격 검증 시간이 초과되었습니다." >&2
          exit 1

      - name: ALB 대상 Health 검증
        env:
          INSTANCE_ID: ${{ steps.new-instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          target_group_arns="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$AUTO_SCALING_GROUP_NAME" \
            --query 'AutoScalingGroups[0].TargetGroupARNs' \
            --output text \
            | tr '\t' '\n' \
            | sed '/^$/d; /^None$/d')"
          if test -z "$target_group_arns"; then
            echo "ASG에 연결된 ALB 대상 그룹이 없습니다: $AUTO_SCALING_GROUP_NAME" >&2
            exit 1
          fi

          for _ in {1..36}; do
            all_targets_healthy=true
            while IFS= read -r target_group_arn; do
              target_health="$(aws elbv2 describe-target-health \
                --target-group-arn "$target_group_arn" \
                --query "TargetHealthDescriptions[?Target.Id=='$INSTANCE_ID'].TargetHealth.{State:State,Reason:Reason,Description:Description}" \
                --output json)"
              state="$(jq -r '.[0].State // "unregistered"' <<< "$target_health")"
              reason="$(jq -r '.[0].Reason // "대상 미등록"' <<< "$target_health")"
              description="$(jq -r '.[0].Description // "대상 그룹에 인스턴스가 등록되지 않았습니다."' <<< "$target_health")"
              echo "대상 그룹=$target_group_arn 상태=$state 사유=$reason 설명=$description"
              if test "$state" != "healthy"; then
                all_targets_healthy=false
              fi
            done <<< "$target_group_arns"
            if test "$all_targets_healthy" = true; then
              exit 0
            fi
            sleep 10
          done
          echo "새 EC2 인스턴스가 ALB Health 검증을 통과하지 못했습니다." >&2
          exit 1
