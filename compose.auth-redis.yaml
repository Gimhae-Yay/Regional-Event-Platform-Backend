services:
  auth-redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "${AUTH_REDIS_PORT:-6379}:6379"
    volumes:
      - auth-redis-data:/data

volumes:
  auth-redis-data:
