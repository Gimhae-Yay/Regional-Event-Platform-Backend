services:
  mysql:
    image: mysql:8.0.42
    environment:
      MYSQL_DATABASE: regional_event
      MYSQL_USER: regional_event
      MYSQL_PASSWORD: regional_event
      MYSQL_ROOT_PASSWORD: local-root-password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${LOCAL_MYSQL_PORT:-13306}:3306"
    volumes:
      - local-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uregional_event -pregional_event --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  local-mysql-data:
  local-redis-data:
